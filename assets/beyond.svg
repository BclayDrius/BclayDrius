<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Languages: Spanish and English native, Portuguese working, Japanese learning. Off the clock: combat sports, powerlifting, Vocaloid and Touhou music.">
<style>@font-face{font-family:'Mo';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'In';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
.mono{font-family:'Mo',monospace} .sans{font-family:'In',Arial,sans-serif}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.3s cubic-bezier(.2,.7,.2,1) both}
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
</style>
