<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Let's build something that sells — barclayleach.com">
<style>@font-face{font-family:'Fr';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Mo';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
.serif{font-family:'Fr',Georgia,serif;font-style:italic} .mono{font-family:'Mo',monospace}
@keyframes pulse{0%,100%{opacity:1;r:9px}50%{opacity:.35;r:6px}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(120px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite} .glow{animation:drift 12s ease-in-out infinite}
</style>
<defs>
<radialGradient id="g" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(540 260) scale(520 220)">
<stop stop-color="#ffa700" stop-opacity=".28"/><stop offset="1" stop-color="#ffa700" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="1200" height="260" rx="28"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="1200" height="260" fill="#050505"/><rect class="glow" x="-200" y="0" width="1600" height="260" fill="url(#g)"/></g>
<rect x=".5" y=".5" width="1199" height="259" rx="27.5" fill="none" stroke="#f3eee3" stroke-opacity=".12"/>
<text x="600" y="132" text-anchor="middle" class="serif" font-size="64" fill="#f3eee3">Let's build something that sells<tspan fill="#ffa700">.</tspan></text>
<text x="600" y="190" text-anchor="middle" class="mono" font-size="14" fill="#f3eee3" fill-opacity=".55" letter-spacing="3.2">BARCLAYLEACH.COM  ·  CERNEXTEC.COM  ·  MADE IN PERÚ</text>
</svg>